name: Build firmware

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      verified_blob_sha:
        description: "Optional Git blob containing the previously verified ST release ZIP"
        type: string
        required: false
        default: ""
      verified_source_commit:
        description: "Source commit matching the verified ST firmware"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.verified_blob_sha == ''
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ccache-${{ github.ref_type }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_type }}-${{ github.ref_name }}-
            ccache-

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Set artifact name
        id: artifact_name
        run: echo "name=passport-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Create release (tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ github.ref_name }}"
          files: release/FoloToy-AI-Passport-full.bin
          fail_on_unmatched_files: true

  export_verified:
    if: github.event_name == 'workflow_dispatch' && inputs.verified_blob_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate source and payload identifiers
        env:
          SOURCE_COMMIT: ${{ inputs.verified_source_commit }}
          BLOB_SHA: ${{ inputs.verified_blob_sha }}
        run: |
          python3 - <<'PY'
          import os, re
          for key in ("SOURCE_COMMIT", "BLOB_SHA"):
              if not re.fullmatch(r"[0-9a-f]{40}", os.environ[key]):
                  raise SystemExit(f"{key} must be a complete Git object SHA")
          PY

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.verified_source_commit }}
          persist-credentials: false

      - name: Retrieve and verify the original ST firmware without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          BLOB_SHA: ${{ inputs.verified_blob_sha }}
          SOURCE_COMMIT: ${{ inputs.verified_source_commit }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, re, subprocess, urllib.request, zipfile
          url = f"{os.environ['GH_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{os.environ['BLOB_SHA']}"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=60) as response:
              blob = json.load(response)
          if blob.get("encoding") != "base64":
              raise SystemExit("Unexpected Git blob encoding")
          payload = base64.b64decode(blob["content"])
          object_hash = hashlib.sha1(b"blob " + str(len(payload)).encode() + b"\0" + payload).hexdigest()
          if object_hash != os.environ["BLOB_SHA"]:
              raise SystemExit("Git blob identity mismatch")
          expected_names = {
              "ST-Otter-AI-Passport-full.bin", "SHA256SUMS.txt",
              "firmware-manifest.json", "firmware-source-sha256.json", "release-provenance.json",
          }
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              if len(archive.infolist()) != len(expected_names) or set(archive.namelist()) != expected_names:
                  raise SystemExit("Unexpected release ZIP members")
              if sum(item.file_size for item in archive.infolist()) > 10000000:
                  raise SystemExit("Release ZIP exceeds the size limit")
              files = {name: archive.read(name) for name in expected_names}
          firmware = files["ST-Otter-AI-Passport-full.bin"]
          expected = "a527335b932e22adb9f7f4c18fed29237afa76d40e07969003797a4264adceae"
          if len(firmware) != 2338400 or hashlib.sha256(firmware).hexdigest() != expected:
              raise SystemExit("Original ST firmware size/hash mismatch")
          provenance = json.loads(files["release-provenance.json"])
          if provenance["source_commit"] != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("Source commit mismatch")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != os.environ["SOURCE_COMMIT"]:
              raise SystemExit("Checkout identity mismatch")
          source_hashes = json.loads(files["firmware-source-sha256.json"])
          for name, expected_hash in source_hashes.items():
              data = subprocess.check_output(["git", "show", "HEAD:" + name])
              if hashlib.sha256(data).hexdigest() != expected_hash:
                  raise SystemExit("Committed firmware source mismatch: " + name)
          for line in files["SHA256SUMS.txt"].decode().splitlines():
              digest, name = line.split("  ", 1)
              if name not in files or hashlib.sha256(files[name]).hexdigest() != digest:
                  raise SystemExit("Release asset checksum mismatch")
          output = pathlib.Path("verified-release")
          output.mkdir(exist_ok=True)
          for name, data in files.items():
              (output / name).write_bytes(data)
          summary = (
              "## Original ST firmware verified\n\n"
              f"Source commit: `{os.environ['SOURCE_COMMIT']}`\n\n"
              f"SHA-256: `{expected}`\n\n"
              "Size: **2,338,400 bytes**. Exported without rebuilding. Device tests: NOT RUN.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(summary)
          print("Original firmware and committed source hashes: PASS")
          PY

      - name: Export verified firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: st-otter-v0.1-verified
          path: verified-release/*
          if-no-files-found: error
          retention-days: 90

  attach_verified_release:
    needs: export_verified
    if: github.event_name == 'workflow_dispatch' && inputs.verified_blob_sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified original firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: st-otter-v0.1-verified
          path: verified-release

      - name: Attach verified files to the existing ST pre-release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload st-otter-v0.1 verified-release/* --repo "$GITHUB_REPOSITORY"
